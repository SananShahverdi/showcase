<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc" fill="none" color="#0B1010" shape-rendering="geometricPrecision">
  <title id="title">Effekt symbol</title>
  <desc id="desc">A square architectural perimeter containing an octagon, a concentric water ring, a central point, and four cardinal axes.</desc>
  <g stroke="currentColor" stroke-linejoin="miter">
    <rect x="6" y="6" width="52" height="52" stroke-width="3"/>
    <polygon points="20,6 44,6 58,20 58,44 44,58 20,58 6,44 6,20" stroke-width="2"/>
    <circle cx="32" cy="32" r="14" stroke-width="2.5"/>
    <g stroke-width="2.5" stroke-linecap="square">
      <line x1="32" y1="2" x2="32" y2="12"/>
      <line x1="32" y1="52" x2="32" y2="62"/>
      <line x1="2" y1="32" x2="12" y2="32"/>
      <line x1="52" y1="32" x2="62" y2="32"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="4" fill="currentColor"/>
</svg>
