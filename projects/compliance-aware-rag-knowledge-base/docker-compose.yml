name: compliance-aware-rag-knowledge-base
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn compliance_aware_rag_knowledge_base.api.app:app --host 0.0.0.0 --port 8016"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8016:8016"
    environment:
      PYTHONPATH: /workspace/src
      COMPLIANCE_AWARE_RAG_KNOWLEDGE_BASE_DATABASE_URL: sqlite:////state/state.sqlite3
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8016/ready')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
    - ./frontend:/app
    - rag-node-modules:/app/node_modules
    ports:
    - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8016/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rag-node-modules:
  state-data:
