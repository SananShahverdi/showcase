name: autonomous-data-quality-observatory
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn autonomous_data_quality_observatory.api.app:app --host 0.0.0.0 --port 8015"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8015:8015"
    environment:
      PYTHONPATH: /workspace/src
      DATA_QUALITY_ALLOWED_DATA_DIR: /workspace/data
      DATA_QUALITY_API_ALLOW_HOSTS: ''
      DATA_QUALITY_DATABASE_URL: sqlite:////state/state.sqlite3
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8015/ready')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
    - ./frontend:/app
    - observatory-node-modules:/app/node_modules
    ports:
    - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8015/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  observatory-node-modules:
  state-data:
