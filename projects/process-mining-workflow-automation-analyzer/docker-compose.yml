name: process-mining-workflow-automation-analyzer
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn process_mining_workflow_automation_analyzer.api.app:app --host 0.0.0.0 --port 8012"
    volumes:
    - .:/workspace
    - state-data:/state
    environment:
      PYTHONPATH: /workspace/src
      PROCESS_MINING_DATABASE_URL: sqlite:////state/state.sqlite3
    ports:
    - "8012:8012"
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
    - ./frontend:/app
    depends_on:
    - api
    ports:
    - "5173:5173"
volumes:
  state-data:
