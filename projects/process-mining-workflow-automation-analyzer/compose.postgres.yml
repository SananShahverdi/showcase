# PostgreSQL instead of the default SQLite volume:
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose -f docker-compose.yml -f compose.postgres.yml up
services:
  api:
    environment:
      PROCESS_MINING_DATABASE_URL: postgresql+psycopg2://portfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/process_mining_workflow_automation_analyzer
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: process_mining_workflow_automation_analyzer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d process_mining_workflow_automation_analyzer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
