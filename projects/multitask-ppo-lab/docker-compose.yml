name: multitask-ppo-lab

services:
  api:
    image: python:3.11-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu && uvicorn multitask_ppo_lab.api.app:app --host 0.0.0.0 --port 8024"
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
    ports:
      - "8024:8024"
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "5176:80"
