name: aiops-incident-assistant-human-approval
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -c "pip install -r requirements-dev.txt && uvicorn aiops_incident_assistant_human_approval.api.app:app --host 0.0.0.0 --port 8006 --reload"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8006:8006"
    environment:
      AIOPS_INCIDENT_ASSISTANT_ENV: local
      PYTHONPATH: /workspace/src
      AIOPS_INCIDENT_ASSISTANT_DATABASE_URL: sqlite:////state/state.sqlite3
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
    - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8006/api
    depends_on:
    - api
volumes:
  state-data:
