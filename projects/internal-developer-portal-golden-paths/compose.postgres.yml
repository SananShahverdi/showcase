# PostgreSQL instead of the default SQLite volume:
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose -f docker-compose.yml -f compose.postgres.yml up
services:
  api:
    environment:
      INTERNAL_DEVELOPER_PORTAL_DATABASE_URL: postgresql+psycopg2://portfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/internal_developer_portal_golden_paths
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: internal_developer_portal_golden_paths
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d internal_developer_portal_golden_paths"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
