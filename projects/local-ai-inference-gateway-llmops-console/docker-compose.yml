name: local-ai-inference-gateway-llmops-console
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -c "pip install -r requirements.txt && uvicorn local_ai_inference_gateway_llmops_console.api.app:app --host 0.0.0.0 --port 8004 --reload"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8004:8004"
    environment:
      LOCAL_AI_INFERENCE_GATEWAY_LLMOPS_CONSOLE_ENV: local
      PYTHONPATH: /workspace/src
      LOCAL_AI_INFERENCE_GATEWAY_LLMOPS_CONSOLE_DATABASE_URL: sqlite:////state/state.sqlite3
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8004
    ports:
    - "5173:5173"
volumes:
  state-data:
