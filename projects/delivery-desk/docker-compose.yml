name: delivery-desk

services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn delivery_desk.api.app:app --host 0.0.0.0 --port 8021"
    volumes:
      - .:/workspace
      - delivery-data:/data
    environment:
      PYTHONPATH: /workspace/src
      DELIVERY_DESK_DB: /data/delivery.sqlite3
    ports:
      - "8021:8021"
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  delivery-data:
