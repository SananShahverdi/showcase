name: real-time-fraud-risk-stream-analytics
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -c "pip install -r requirements-dev.txt && uvicorn real_time_fraud_risk_stream_analytics.api.app:app --host 0.0.0.0 --port 8009 --reload"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8009:8009"
    environment:
      REAL_TIME_FRAUD_ENV: local
      PYTHONPATH: /workspace/src
      REAL_TIME_FRAUD_DATABASE_URL: sqlite:////state/state.sqlite3
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
    - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8009/api
    depends_on:
    - api
volumes:
  state-data:
