name: stockroom-inventory

services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -r requirements.txt && uvicorn stockroom_inventory.api.app:app --host 0.0.0.0 --port 8022"
    volumes:
      - .:/workspace
      - inventory-data:/data
    environment:
      PYTHONPATH: /workspace/src
      STOCKROOM_INVENTORY_DB: /data/inventory.sqlite3
    ports:
      - "8022:8022"
  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  inventory-data:
