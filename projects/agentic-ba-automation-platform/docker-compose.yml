name: agentic-ba-automation-platform
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -c "pip install -r requirements.txt && uvicorn agentic_ba_automation_platform.api.app:app --host 0.0.0.0 --port 8001 --reload"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8001:8001"
    environment:
      AGENTIC_BA_AUTOMATION_PLATFORM_ENV: local
      PYTHONPATH: /workspace/src
      AGENTIC_BA_AUTOMATION_PLATFORM_DATABASE_URL: sqlite:////state/state.sqlite3
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8001
    ports:
    - "5173:5173"
volumes:
  state-data:
