name: ai-code-review-test-gatekeeper
services:
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -c "pip install -r requirements-dev.txt && uvicorn ai_code_review_test_gatekeeper.api.app:app --host 0.0.0.0 --port 8007 --reload"
    volumes:
    - .:/workspace
    - state-data:/state
    ports:
    - "8007:8007"
    environment:
      AI_CODE_REVIEW_ENV: local
      PYTHONPATH: /workspace/src
      AI_CODE_REVIEW_DATABASE_URL: sqlite:////state/state.sqlite3
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
    - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8007/api
    depends_on:
    - api
volumes:
  state-data:
